<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEEDY-ANTITUSSIVES</title>
<style>
  :root {
    --surface:#ffebee; --face:#fffafb; --highlight:#fefafb;
    --shadow:#cb2a4a; --frame:#ff4d6d;
    --title-l:#ff6b89; --title-r:#fff4d6; --title-text:#ffffff;
    --text:#4a3f3f; --text-dim:#6a3840;
    --field-bg:#fff5f5; --scroll-thumb:#dedede; --scroll-track:#ffffff;
    --danger:#c04040;
    --border-r: inset -1px -1px var(--frame), inset 1px 1px var(--highlight);
    --border-ri: inset -2px -2px var(--shadow), inset 2px 2px var(--face);
    --border-s: inset -1px -1px var(--highlight), inset 1px 1px var(--frame);
    --border-si: inset -2px -2px var(--face), inset 2px 2px var(--shadow);
    --border-w: inset -1px -1px var(--frame), inset 1px 1px var(--face);
    --border-wi: inset -2px -2px var(--shadow), inset 2px 2px var(--highlight);
    --bg: #ffcccc;
    font-family:"굴림","Gulim","MS Sans Serif",Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 12px; -webkit-font-smoothing: none; }
  ::-webkit-scrollbar { width: 16px; height: 16px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); box-shadow: var(--border-r), var(--border-ri); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 64px; }
  .titlebar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(90deg, var(--title-l), var(--title-r));
    border-bottom: 2px solid var(--frame);
  }
  .titlebar-inner { max-width: 480px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
  .titlebar h1 { font-size: 18px; margin: 0; font-weight: 900; color: var(--title-text); letter-spacing: .3px; }
  p.desc { color: var(--text-dim); margin-top: 0; margin-bottom: 16px; font-size: 12px; line-height: 1.6; padding: 0 2px; }
  .card { background: var(--surface); box-shadow: var(--border-w), var(--border-wi); padding: 0 14px 14px; margin-bottom: 16px; }
  .card.win-collapsed { padding-bottom: 0; }
  .card.win-collapsed > *:not(.card-title) { display: none !important; }
  .card-title {
    font-size: 12px; color: var(--title-text); margin: 0 -14px 12px; font-weight: 700;
    padding: 3px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: linear-gradient(90deg, var(--title-l), var(--title-r));
    box-shadow: var(--border-r), var(--border-ri);
  }
  .card-title .win-btns { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .card-title .win-btn {
    width: 16px; height: 14px; padding: 0; border: none; cursor: pointer;
    background: var(--surface); color: var(--text);
    box-shadow: var(--border-r), var(--border-ri);
    font-size: 8px; line-height: 1; display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .card-title .win-btn:active { box-shadow: var(--border-s), var(--border-si); }
  .card-title .win-max::after { content: ''; display: block; width: 7px; height: 6px; border: 1px solid currentColor; }
  .card-title span.card-title-text { flex: 1; min-width: 0; }
  .hint { font-size: 11px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.6; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; background: var(--field-bg); border: none; color: var(--text);
    box-shadow: var(--border-s), var(--border-si);
    padding: 7px 8px; font-size: 13px; font-family: inherit; outline: none;
  }
  button.primary, button.ghost {
    border: none; background: var(--surface); color: var(--text);
    box-shadow: var(--border-r), var(--border-ri);
    cursor: pointer; font-family: inherit; font-weight: 700; flex-shrink: 0;
  }
  button.primary { padding: 7px 16px; font-size: 13px; }
  button.ghost { padding: 4px 10px; font-size: 11px; }
  button.primary:hover, button.ghost:hover { background: var(--highlight); }
  button.primary:active, button.ghost:active { box-shadow: var(--border-s), var(--border-si); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { margin-top: 12px; }
  .result:empty { display: none; }
  .beta-ok { padding: 10px; background: var(--face); box-shadow: var(--border-r), var(--border-ri); }
  .beta-ok .apply-title { margin-bottom: 6px; }
  .beta-guide {
    max-height: 280px; overflow-y: auto; padding: 8px 10px; line-height: 1.7;
    background: var(--field-bg); box-shadow: var(--border-s), var(--border-si);
  }
  .beta-guide h3 { font-size: 13px; margin: 0 0 6px; }
  .beta-guide hr { border: none; border-top: 1px solid var(--frame); margin: 12px 0; }
  .beta-guide h4 { font-size: 12px; margin: 14px 0 4px; }
  .beta-guide p, .beta-guide ul { margin: 0 0 8px; }
  .beta-guide ul { padding-left: 18px; }
  .beta-guide code { font-family: Consolas, "굴림체", monospace; font-size: 11px; }
  .beta-guide a { color: var(--shadow); word-break: break-all; }
  .beta-agree { display: flex; align-items: flex-start; gap: 6px; margin-top: 10px; cursor: pointer; }
  .beta-agree.locked { color: var(--text-dim); cursor: not-allowed; }
  .beta-agree input { accent-color: #fe7c96; margin-top: 2px; }
  .beta-ok .actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .flyer { display: block; width: 100%; height: auto; margin-bottom: 12px; box-shadow: var(--border-s), var(--border-si); }
  .pw {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px; background: var(--face); box-shadow: var(--border-r), var(--border-ri);
  }
  .pw span { font-family: Consolas, "굴림체", monospace; font-size: 16px; font-weight: 700; word-break: break-all; }
  .msg { color: var(--danger); font-size: 12px; }
  .apply { margin-top: 10px; padding: 10px; background: var(--face); box-shadow: var(--border-s), var(--border-si); }
  .apply-title { font-weight: 700; margin-bottom: 4px; }
  .apply .field { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .apply .field label { width: 44px; flex-shrink: 0; font-size: 11px; color: var(--text-dim); }
  .apply .actions { display: flex; justify-content: flex-end; }
  .apply-status { font-size: 12px; margin-top: 6px; }
  .apply-status.error { color: var(--danger); }
</style>
</head>
<body>
<div class="titlebar"><div class="titlebar-inner"><h1>EXP-TENSIONS PAGE</h1></div></div>
<div class="wrap">
  <p class="desc">악용 방지를 위해 조회 시각, 입력한 아이디, 조회 결과가 기록됩니다. 기록은 운영자만 볼 수 있으며 외부에 공개되지 않습니다.</p>

  <h3>베타 테스트 안내</h3>
  <p>이 베타는 맞춤법 검사기를 개선하기 위한 오류 수집을 목적으로 배포하며, <b>적극적인 오류 제보를 베타 테스트 참여 조건</b>으로 두고 있습니다. 맞는 말을 오류로 잡았을 때, 틀린 말을 놓쳤을 때, 추천어나 유의어·뜻풀이가 이상할 때는 꼭 '오류 제보'로 알려 주세요!</p>
  <hr />

  <h3>타타 바른말도우미 (맞춤법 검사기)</h3>
  <p>코코포리아 채팅을 보내기 전에 맞춤법과 띄어쓰기를 확인하는 한국어 맞춤법 검사기이며, 국어사전과 유의어·반의어 사전도 함께 제공합니다. 기본 검사와 사전은 사용자의 컴퓨터 안에서만 동작하며, 문장을 외부로 보내지 않습니다.</p>
  <p>검사는 Hunspell 엔진과 한국어 사전 hunspell-dict-ko를 바탕으로 하고, 띄어쓰기·문법 규칙은 「한글 맞춤법」, 「표준어 규정」, 「문장 부호」(문화체육관광부 고시)와 국립국어원 해설을 근거로 직접 만들었습니다. 교정 메뉴에 근거 조항을 함께 표시합니다. 국어사전 뜻풀이와 유의어·반의어는 국립국어원 「우리말샘」 데이터를 씁니다. 검사 결과는 참고용이며, 은어나 캐릭터 말투는 오류로 표시될 수 있습니다.</p>

  <h4>실험실: AI 기능 (선택)</h4>
  <p>기본값은 꺼져 있으며, 사용자 본인의 Google Gemini API 키로 동작합니다. '정밀 검사'나 'AI 추천'을 누를 때만 입력란의 메시지가 Google로 전송되며, 룸 정보와 다른 참가자의 채팅은 보내지 않고 교정 제외 단어와 지정한 부분은 가린 뒤 보냅니다. 무료 API 키를 사용하면 전송한 내용과 응답을 Google이 제품 및 머신러닝 기술의 개선·개발에 사용할 수 있으며, 검토자가 열람할 수 있습니다. 개인정보나 공개되지 않은 시나리오 내용은 전송하지 마십시오. 만 18세 이상만 사용할 수 있으며, Google의 약관(<a href="https://ai.google.dev/gemini-api/terms" target="_blank" rel="noopener">https://ai.google.dev/gemini-api/terms</a>)이 적용됩니다. API 키는 사용자의 브라우저에만 저장됩니다.</p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUhAPisD5O2mNXU0kuJ1-vHIT17QvTPKEcpv7KR9P_BArGgZ_fitHCWaBiRT01uZ6fSg/exec";
// ==========================================================

const APPLY_TEXT = {
  apply: {
    title: '화이트리스트 신청',
    hint: '닉네임과 맞팔로우 상태의 X(구 Twitter) 아이디를 남기면 운영자에게 전달됩니다. 같은 아이디는 1일 1회까지만 화이트리스트 신청 가능합니다.',
  },
  beta_apply: {
    title: '베타테스트 신청',
    hint: '닉네임과 X(구 Twitter) 아이디를 남기면 운영자에게 전달됩니다. 같은 아이디는 1일 1회까지만 베타테스트 신청 가능합니다.',
  },
};

function api(params) {
  return fetch(API_URL + '?' + new URLSearchParams(params)).then(r => r.json());
}

function msg(text) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.textContent = text;
  return div;
}

// 조회 실패 시 나오는 신청 박스. action: 'apply'(화이트리스트) 또는 'beta_apply'
function buildApplyBox(id, action) {
  const t = APPLY_TEXT[action];
  const box = document.createElement('div');
  box.className = 'apply';
  box.innerHTML = `
    <div class="apply-title"></div>
    <p class="hint"></p>
    <div class="field"><label>닉네임</label><input type="text" class="nick" maxlength="30" autocomplete="off" spellcheck="false" /></div>
    <div class="field"><label>아이디</label><input type="text" class="aid" maxlength="50" autocomplete="off" spellcheck="false" /></div>
    <div class="actions"><button type="button" class="primary">신청</button></div>
    <div class="apply-status"></div>`;
  box.querySelector('.apply-title').textContent = t.title;
  box.querySelector('.hint').textContent = t.hint;
  const nick = box.querySelector('.nick');
  const aid = box.querySelector('.aid');
  const btn = box.querySelector('button');
  const status = box.querySelector('.apply-status');
  aid.value = id;

  const setStatus = (text, isError) => {
    status.textContent = text;
    status.classList.toggle('error', isError);
  };

  btn.onclick = async () => {
    const n = nick.value.trim();
    const a = aid.value.trim();
    if (!n || !a) return setStatus('닉네임과 아이디를 모두 입력하세요.', true);
    btn.disabled = true;
    btn.textContent = '신청 중...';
    try {
      const data = await api({ action, nick: n, id: a });
      if (data.ok) {
        setStatus('신청되었습니다. 운영자가 확인 후 등록합니다.', false);
        btn.textContent = '신청 완료';
        return;
      }
      setStatus(data.error === 'dup' ? '오늘은 이 아이디로 이미 신청했습니다. 내일 다시 시도해 주세요.' : '신청에 실패했습니다. (' + data.error + ')', true);
    } catch {
      setStatus('서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.', true);
    }
    btn.disabled = false;
    btn.textContent = '신청';
  };
  return box;
}

function showPassword(password) {
  const box = document.createElement('div');
  box.className = 'pw';
  const span = document.createElement('span');
  span.textContent = password;
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'ghost';
  copy.textContent = '복사';
  copy.onclick = () => navigator.clipboard.writeText(password).then(() => copy.textContent = '복사됨');
  box.append(span, copy);
  return box;
}

function base64ToBlob(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || 'application/octet-stream' });
}

// 베타 조회 성공: 배포 안내문 → (끝까지 스크롤) → 동의 체크 → 파일 받기
function showBeta(id) {
  const box = document.createElement('div');
  box.className = 'beta-ok';
  box.innerHTML = `
    <div class="apply-title">배포 안내문</div>
    <p class="hint">파일 다운로드 전, 아래 안내문을 모두 확인해주세요.</p>
    <div class="beta-guide"></div>
    <label class="beta-agree locked"><input type="checkbox" disabled /> <span>안내문을 모두 확인하였으며, 안내된 내용을 지키지 않아 생기는 문제는 사용자 본인에게 책임이 있음을 이해했습니다.</span></label>
    <div class="actions"><button type="button" class="primary" disabled>베타 파일 다운로드</button></div>
    <div class="apply-status"></div>`;
  const guide = box.querySelector('.beta-guide');
  const agree = box.querySelector('.beta-agree');
  const check = agree.querySelector('input');
  const btn = box.querySelector('button');
  const status = box.querySelector('.apply-status');
  guide.append(document.getElementById('betaGuide').content.cloneNode(true));

  const unlockIfRead = () => {
    if (guide.scrollTop + guide.clientHeight < guide.scrollHeight - 4) return;
    check.disabled = false;
    agree.classList.remove('locked');
    guide.removeEventListener('scroll', unlockIfRead);
  };
  guide.addEventListener('scroll', unlockIfRead);
  requestAnimationFrame(unlockIfRead); // 화면이 커서 스크롤할 필요가 없는 경우

  check.addEventListener('change', () => { btn.disabled = !check.checked; });

  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = '파일 받는 중...';
    status.textContent = '';
    status.classList.remove('error');
    try {
      const data = await api({ action: 'beta_file', id });
      if (!data.ok) throw new Error(data.error === 'nofile' ? '아직 파일이 준비되지 않았습니다.' : '파일을 받지 못했습니다. (' + data.error + ')');
      const url = URL.createObjectURL(base64ToBlob(data.data, data.mime));
      const a = document.createElement('a');
      a.href = url;
      a.download = data.name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      status.textContent = '다운로드를 시작했습니다.';
    } catch (err) {
      status.textContent = err instanceof TypeError ? '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.' : err.message;
      status.classList.add('error');
    }
    btn.disabled = !check.checked;
    btn.textContent = '베타 파일 다운로드';
  };
  return box;
}

// 아이디 입력 폼 하나를 서버 조회에 연결한다
function wireLookup(formId, { action, notfoundText, applyAction, onSuccess }) {
  const form = document.getElementById(formId);
  const input = form.querySelector('input');
  const btn = form.querySelector('button');
  const result = form.closest('.card').querySelector('.result');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const id = input.value.trim();
    result.innerHTML = '';
    if (!id) return;

    btn.disabled = true;
    btn.textContent = '조회 중...';
    try {
      const data = await api(action ? { action, id } : { id });
      if (data.ok) {
        result.append(onSuccess(data, id));
      } else if (data.error === 'notfound') {
        result.append(msg(notfoundText), buildApplyBox(id, applyAction));
      } else {
        result.append(msg({ limit: '이미 조회한 아이디입니다.', empty: '아이디를 입력하세요.' }[data.error] || '조회에 실패했습니다.'));
      }
    } catch {
      result.append(msg('서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.'));
    } finally {
      btn.disabled = false;
      btn.textContent = '조회';
    }
  });
}

wireLookup('pwForm', {
  notfoundText: '등록되지 않은 아이디입니다.',
  applyAction: 'apply',
  onSuccess: data => showPassword(data.password),
});
wireLookup('betaForm', {
  action: 'beta',
  notfoundText: '베타테스터 명단에 없는 아이디입니다.',
  applyAction: 'beta_apply',
  onSuccess: (data, id) => showBeta(id),
});

// 창 버튼: ━ 접기, □ 펼치기, ✕ 입력/결과 지우기
document.querySelectorAll('.win-min').forEach(btn => btn.addEventListener('click', () => btn.closest('.card').classList.toggle('win-collapsed')));
document.querySelectorAll('.win-max').forEach(btn => btn.addEventListener('click', () => btn.closest('.card').classList.remove('win-collapsed')));
document.querySelectorAll('.win-close').forEach(btn => btn.addEventListener('click', () => {
  const card = btn.closest('.card');
  card.querySelector('form input').value = '';
  card.querySelector('.result').innerHTML = '';
}));
</script>
</body>
